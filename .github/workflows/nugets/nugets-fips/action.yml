name: Nuget FIPS
description: This builds the Devolutions.Crypto.Core.Fips nuget
runs:
  using: composite
  steps:
    - name: Download Config
      uses: actions/download-artifact@v8
      with:
        name: config.txt
        path: ./wrappers/csharp

    # The managed assemblies are the same as in Devolutions.Crypto.Core
    - name: Download Managed Libs
      uses: actions/download-artifact@v8
      with:
        name: native-windows
        path: ./wrappers/csharp

    - name: Download FIPS Native Libs
      uses: actions/download-artifact@v8
      with:
        pattern: fips-native-*
        merge-multiple: true
        path: ./wrappers/csharp/fips

    - name: Downloading nuget
      working-directory: ./wrappers/csharp/nuget
      shell: bash
      run : curl https://dist.nuget.org/win-x86-commandline/latest/nuget.exe --output nuget.exe

    - name: Read version from config file
      shell: bash
      working-directory: ./wrappers/csharp
      run: |
          VERSION=$(grep 'version' config.txt | cut -d '=' -f2 | tr -d ' "')

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

    - name: Generating DOTNET FIPS Nuget
      working-directory: ./wrappers/csharp/nuget
      shell: bash
      run: |
        ls -R ../fips
        ./nuget.exe pack ./dotnet-core-fips/Devolutions.Crypto.Core.Fips.nuspec -Version $VERSION -OutputDirectory ./dotnet-core-fips/package

    - name: Place Artifacts
      shell: bash
      run: mv wrappers/csharp/nuget/dotnet-core-fips/package/*.nupkg .

    - uses: actions/upload-artifact@v7
      with:
        include-hidden-files: true
        name: fips-nugets
        path: ./*.nupkg
